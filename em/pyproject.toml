[project]
name = "em"
version = "2.0.0"
description = "使用导向的东方财富数据意图查询 CLI"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "curl_cffi>=0.6",
    "pyyaml>=6.0",
    "pycryptodome>=3.19",
]

[project.scripts]
em = "em.cli:_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]