# em 指标目录 —— 数据意图 → 口径 → 多源 provider 链
# kind: scalar(单值) | series(序列) | table(清单)
# providers 有序兜底链：priority 升序尝试，命中即停；失败自动降级

groups:
  quote: 行情
  capital: 资金
  finance: 财务
  f10: 公司资料
  company: 股东与高管
  news: 资讯
  fund: 基金
  macro: 宏观
  guba: 股吧
  tool: 工具
  event: 数据中心事件

metrics:
  # =====================================================================
  # 行情 · 价格
  # =====================================================================
  - id: price
    name: 最新价
    aliases: [现价, latest, last_price, 当前价]
    group: quote
    kind: scalar
    unit: 元
    args: {code: {required: true}}
    providers: [{endpoint: quote.snapshot, field: price, args: {code: code}, priority: 1}]

  - id: close
    name: 收盘价
    aliases: [收盘, close_price, 收]
    group: quote
    kind: scalar
    unit: 元
    args: {code: {required: true}, trade_date: {required: false}}
    calibrations:
      adjust: {values: [none, qfq, hfq], default: none}
    providers:
      - {endpoint: quote.kline, field: close, args: {code: code, klt: 101, fqt: fqt, lmt: 80, end: trade_date}, priority: 1}
      - {endpoint: quote.snapshot, field: price, args: {code: code}, priority: 2}

  - id: open
    name: 开盘价
    aliases: [开盘, open_price]
    group: quote
    kind: scalar
    unit: 元
    args: {code: {required: true}, trade_date: {required: false}}
    calibrations:
      adjust: {values: [none, qfq, hfq], default: none}
    providers:
      - {endpoint: quote.snapshot, field: open, args: {code: code}, priority: 1}
      - {endpoint: quote.kline, field: open, args: {code: code, klt: 101, fqt: fqt, lmt: 80, end: trade_date}, priority: 2}

  - id: high
    name: 最高价
    aliases: [最高, high_price]
    group: quote
    kind: scalar
    unit: 元
    args: {code: {required: true}, trade_date: {required: false}}
    calibrations:
      adjust: {values: [none, qfq, hfq], default: none}
    providers:
      - {endpoint: quote.snapshot, field: high, args: {code: code}, priority: 1}
      - {endpoint: quote.kline, field: high, args: {code: code, klt: 101, fqt: fqt, lmt: 80, end: trade_date}, priority: 2}

  - id: low
    name: 最低价
    aliases: [最低, low_price]
    group: quote
    kind: scalar
    unit: 元
    args: {code: {required: true}, trade_date: {required: false}}
    calibrations:
      adjust: {values: [none, qfq, hfq], default: none}
    providers:
      - {endpoint: quote.snapshot, field: low, args: {code: code}, priority: 1}
      - {endpoint: quote.kline, field: low, args: {code: code, klt: 101, fqt: fqt, lmt: 80, end: trade_date}, priority: 2}

  - id: pre_close
    name: 昨收价
    aliases: [昨收, prev_close, previous_close]
    group: quote
    kind: scalar
    unit: 元
    args: {code: {required: true}}
    providers: [{endpoint: quote.snapshot, field: pre_close, args: {code: code}, priority: 1}]

  - id: limit_up
    name: 涨停价
    aliases: [涨停价, 涨停]
    group: quote
    kind: scalar
    unit: 元
    args: {code: {required: true}}
    providers: [{endpoint: quote.snapshot, field: limit_up, args: {code: code}, priority: 1}]

  - id: limit_down
    name: 跌停价
    aliases: [跌停价]
    group: quote
    kind: scalar
    unit: 元
    args: {code: {required: true}}
    providers: [{endpoint: quote.snapshot, field: limit_down, args: {code: code}, priority: 1}]

  - id: change
    name: 涨跌额
    aliases: [涨跌, change_amt]
    group: quote
    kind: scalar
    unit: 元
    args: {code: {required: true}}
    providers:
      - {endpoint: quote.snapshot, field: change, args: {code: code}, priority: 1}
      - {endpoint: quote.kline, field: change, args: {code: code, klt: 101, fqt: 0, lmt: 80, end: trade_date}, priority: 2}

  - id: pct_change
    name: 涨跌幅
    aliases: [涨跌幅, percent_change, 涨幅]
    group: quote
    kind: scalar
    unit: "%"
    args: {code: {required: true}}
    providers:
      - {endpoint: quote.snapshot, field: pct_change, args: {code: code}, priority: 1}
      - {endpoint: quote.kline, field: pct_change, args: {code: code, klt: 101, fqt: 0, lmt: 80, end: trade_date}, priority: 2}

  - id: amplitude
    name: 振幅
    aliases: [振幅]
    group: quote
    kind: scalar
    unit: "%"
    args: {code: {required: true}}
    providers: [{endpoint: quote.snapshot, field: amplitude, args: {code: code}, priority: 1}]

  # 行情 · 量
  - id: volume
    name: 成交量
    aliases: [成交量, vol]
    group: quote
    kind: scalar
    unit: 手
    args: {code: {required: true}}
    providers:
      - {endpoint: quote.snapshot, field: volume, args: {code: code}, priority: 1}
      - {endpoint: quote.kline, field: volume, args: {code: code, klt: 101, fqt: 0, lmt: 80, end: trade_date}, priority: 2}

  - id: amount
    name: 成交额
    aliases: [成交额, turnover_amount]
    group: quote
    kind: scalar
    unit: 元
    args: {code: {required: true}}
    providers:
      - {endpoint: quote.snapshot, field: amount, args: {code: code}, priority: 1}
      - {endpoint: quote.kline, field: amount, args: {code: code, klt: 101, fqt: 0, lmt: 80, end: trade_date}, priority: 2}

  - id: turnover_rate
    name: 换手率
    aliases: [换手率, 换手, turnover]
    group: quote
    kind: scalar
    unit: "%"
    args: {code: {required: true}}
    providers:
      - {endpoint: quote.snapshot, field: turnover_rate, args: {code: code}, priority: 1}
      - {endpoint: quote.kline, field: turnover_rate, args: {code: code, klt: 101, fqt: 0, lmt: 80, end: trade_date}, priority: 2}
    equivalence: {sources: [quote.snapshot, quote.kline], tolerance: 0.01, verified: false}

  - id: volume_ratio
    name: 量比
    aliases: [量比]
    group: quote
    kind: scalar
    unit: ""
    args: {code: {required: true}}
    providers: [{endpoint: quote.snapshot, field: volume_ratio, args: {code: code}, priority: 1}]

  # 行情 · 估值
  - id: pe
    name: 市盈率
    aliases: [市盈率, PE, 市盈]
    group: quote
    kind: scalar
    unit: 倍
    args: {code: {required: true}}
    calibrations:
      scope: {values: [ttm, dynamic, static], default: ttm, maps: {ttm: pe_ttm, dynamic: pe_dynamic, static: pe_static}}
    providers: [{endpoint: quote.snapshot, field: "{scope_field}", args: {code: code}, priority: 1}]

  - id: pb
    name: 市净率
    aliases: [市净率, PB, 市净]
    group: quote
    kind: scalar
    unit: 倍
    args: {code: {required: true}}
    providers: [{endpoint: quote.snapshot, field: pb, args: {code: code}, priority: 1}]

  - id: total_mv
    name: 总市值
    aliases: [总市值, market_cap, 市值]
    group: quote
    kind: scalar
    unit: 元
    args: {code: {required: true}}
    providers: [{endpoint: quote.snapshot, field: total_mv, args: {code: code}, priority: 1}]

  - id: float_mv
    name: 流通市值
    aliases: [流通市值, float_cap]
    group: quote
    kind: scalar
    unit: 元
    args: {code: {required: true}}
    providers: [{endpoint: quote.snapshot, field: float_mv, args: {code: code}, priority: 1}]

  # 行情 · 资金净流入（快照主成分）
  - id: main_net_inflow
    name: 主力净流入
    aliases: [主力净额, main_net]
    group: quote
    kind: scalar
    unit: 元
    args: {code: {required: true}}
    providers: [{endpoint: quote.snapshot, field: main_net_inflow, args: {code: code}, priority: 1}]

  - id: super_net_inflow
    name: 超大单净流入
    aliases: [超大单净额]
    group: quote
    kind: scalar
    unit: 元
    args: {code: {required: true}}
    providers: [{endpoint: quote.snapshot, field: super_net_inflow, args: {code: code}, priority: 1}]

  - id: large_net_inflow
    name: 大单净流入
    aliases: [大单净额]
    group: quote
    kind: scalar
    unit: 元
    args: {code: {required: true}}
    providers: [{endpoint: quote.snapshot, field: large_net_inflow, args: {code: code}, priority: 1}]

  - id: mid_net_inflow
    name: 中单净流入
    aliases: [中单净额]
    group: quote
    kind: scalar
    unit: 元
    args: {code: {required: true}}
    providers: [{endpoint: quote.snapshot, field: mid_net_inflow, args: {code: code}, priority: 1}]

  - id: small_net_inflow
    name: 小单净流入
    aliases: [小单净额, 散户净额]
    group: quote
    kind: scalar
    unit: 元
    args: {code: {required: true}}
    providers: [{endpoint: quote.snapshot, field: small_net_inflow, args: {code: code}, priority: 1}]

  # 行情 · K线 / 分时 / 盘口
  - id: kline_daily
    name: 日K线
    aliases: [日K, kline, K线]
    group: quote
    kind: series
    args: {code: {required: true}, trade_date: {required: false}}
    calibrations:
      adjust: {values: [none, qfq, hfq], default: none}
    providers: [{endpoint: quote.kline, field: "", args: {code: code, klt: 101, fqt: fqt, lmt: 120, end: trade_date}, row: all, priority: 1}]

  - id: kline_weekly
    name: 周K线
    aliases: [周K, kline_w]
    group: quote
    kind: series
    args: {code: {required: true}}
    calibrations:
      adjust: {values: [none, qfq, hfq], default: none}
    providers: [{endpoint: quote.kline, field: "", args: {code: code, klt: 102, fqt: fqt, lmt: 120}, row: all, priority: 1}]

  - id: kline_monthly
    name: 月K线
    aliases: [月K, kline_m]
    group: quote
    kind: series
    args: {code: {required: true}}
    calibrations:
      adjust: {values: [none, qfq, hfq], default: none}
    providers: [{endpoint: quote.kline, field: "", args: {code: code, klt: 103, fqt: fqt, lmt: 120}, row: all, priority: 1}]

  - id: tick
    name: 分时成交
    aliases: [分时, trend, 逐笔]
    group: quote
    kind: series
    args: {code: {required: true}}
    providers: [{endpoint: quote.trends, field: "", args: {code: code, ndays: 1}, row: all, priority: 1}]

  - id: orderbook
    name: 五档盘口
    aliases: [盘口, 五档, order_book]
    group: quote
    kind: table
    args: {code: {required: true}}
    providers: [{endpoint: quote.orderbook, field: "", args: {code: code}, priority: 1}]

  # 行情 · 榜单
  - id: industry_index
    name: 行业板块行情
    aliases: [行业板块, 行业指数]
    group: quote
    kind: table
    args: {page_size: {required: false}}
    providers: [{endpoint: quote.clist, field: "", args: {fs: "m:90+t:2", page_size: page_size}, row: all, priority: 1}]

  - id: concept_board
    name: 概念板块行情
    aliases: [概念板块, 概念]
    group: quote
    kind: table
    args: {page_size: {required: false}}
    providers: [{endpoint: quote.clist, field: "", args: {fs: "m:90+t:3", page_size: page_size}, row: all, priority: 1}]

  - id: global_index
    name: 全球指数
    aliases: [全球指数, 国际指数]
    group: quote
    kind: table
    args: {page_size: {required: false}}
    providers: [{endpoint: cross.global_index, field: "", args: {page_size: page_size}, row: all, priority: 1}]

  - id: bond_list
    name: 债券列表
    aliases: [债券, bond]
    group: quote
    kind: table
    args: {page_size: {required: false}}
    providers: [{endpoint: cross.bond, field: "", args: {page_size: page_size}, row: all, priority: 1}]

  - id: bj_stock
    name: 北交所股票列表
    aliases: [北交所, 北证]
    group: quote
    kind: table
    args: {page_size: {required: false}}
    providers: [{endpoint: cross.bj, field: "", args: {page_size: page_size}, row: all, priority: 1}]

  - id: zt_pool
    name: 涨停池
    aliases: [涨停池, 涨停板]
    group: quote
    kind: table
    args: {trade_date: {required: false}, page_size: {required: false}}
    providers: [{endpoint: pool.get, field: "", args: {kind: zt, trade_date: trade_date, page_size: page_size}, row: all, priority: 1}]

  - id: dt_pool
    name: 跌停池
    aliases: [跌停池, 跌停板]
    group: quote
    kind: table
    args: {trade_date: {required: false}, page_size: {required: false}}
    providers: [{endpoint: pool.get, field: "", args: {kind: dt, trade_date: trade_date, page_size: page_size}, row: all, priority: 1}]

  - id: zb_pool
    name: 炸板池
    aliases: [炸板池, 炸板]
    group: quote
    kind: table
    args: {trade_date: {required: false}, page_size: {required: false}}
    providers: [{endpoint: pool.get, field: "", args: {kind: zb, trade_date: trade_date, page_size: page_size}, row: all, priority: 1}]

  - id: yzt_pool
    name: 昨日涨停池
    aliases: [昨日涨停, yzt]
    group: quote
    kind: table
    args: {trade_date: {required: false}, page_size: {required: false}}
    providers: [{endpoint: pool.get, field: "", args: {kind: yzt, trade_date: trade_date, page_size: page_size}, row: all, priority: 1}]

  # =====================================================================
  # 资金
  # =====================================================================
  - id: moneyflow
    name: 资金流向（历史）
    aliases: [资金流向, 资金流, money_flow]
    group: capital
    kind: series
    unit: 元
    args: {code: {required: true}}
    providers: [{endpoint: money.flow, field: "", args: {code: code, lmt: 20}, row: all, priority: 1}]

  # 资金流向 · 全口径（push2 clist/ulist，字段映射见 providers/quote.py）
  - id: stock_moneyflow_rank
    name: 个股资金流排行
    aliases: [个股资金流排行, 主力净流入排名, 资金流排行, main_moneyflow_rank]
    group: capital
    kind: table
    args: {market: {required: false}, stat: {required: false}, page_size: {required: false}}
    calibrations:
      stat: {values: [today, 3d, 5d, 10d], default: today}
      market: {values: [all, hsa, sha, kcb, sza, cyb, zxb, hb, sb, bja], default: all}
    providers: [{endpoint: flow.stock_rank, field: "", args: {market: market, stat: stat, page_size: page_size}, row: all, priority: 1}]

  - id: industry_moneyflow_rank
    name: 行业资金流排行
    aliases: [行业资金流, 行业资金流排行, industry_moneyflow_rank]
    group: capital
    kind: table
    args: {stat: {required: false}, page_size: {required: false}}
    calibrations:
      stat: {values: [today, 3d, 5d, 10d], default: today}
    providers: [{endpoint: flow.board_rank, field: "", args: {board: industry, stat: stat, page_size: page_size}, row: all, priority: 1}]

  - id: concept_moneyflow_rank
    name: 概念资金流排行
    aliases: [概念资金流, 概念资金流排行, concept_moneyflow_rank]
    group: capital
    kind: table
    args: {stat: {required: false}, page_size: {required: false}}
    calibrations:
      stat: {values: [today, 3d, 5d, 10d], default: today}
    providers: [{endpoint: flow.board_rank, field: "", args: {board: concept, stat: stat, page_size: page_size}, row: all, priority: 1}]

  - id: region_moneyflow_rank
    name: 地域资金流排行
    aliases: [地域资金流, 地域资金流排行, region_moneyflow_rank]
    group: capital
    kind: table
    args: {stat: {required: false}, page_size: {required: false}}
    calibrations:
      stat: {values: [today, 3d, 5d, 10d], default: today}
    providers: [{endpoint: flow.board_rank, field: "", args: {board: region, stat: stat, page_size: page_size}, row: all, priority: 1}]

  - id: market_moneyflow
    name: 大盘/指数资金流
    aliases: [大盘资金流, 指数资金流, 沪深两市资金流, market_moneyflow]
    group: capital
    kind: table
    args: {index: {required: false}}
    calibrations:
      index: {values: [hs2, sh, sz, cyb, shb, szb, kcb], default: hs2}
    providers: [{endpoint: flow.index, field: "", args: {index: index}, row: all, priority: 1}]

  - id: market_moneyflow_history
    name: 大盘/指数资金流历史
    aliases: [大盘资金流历史, 指数资金流历史, market_moneyflow_history]
    group: capital
    kind: series
    unit: 元
    args: {index: {required: false}, lmt: {required: false}}
    calibrations:
      index: {values: [sh, sz, cyb, shb, szb, kcb], default: sh}
    providers: [{endpoint: flow.index_kline, field: "", args: {index: index, lmt: lmt}, row: all, priority: 1}]

  - id: board_stock_moneyflow
    name: 板块内个股资金流
    aliases: [板块内个股资金流, 板块个股资金流, board_stock_moneyflow]
    group: capital
    kind: table
    args: {board_code: {required: true}, stat: {required: false}, page_size: {required: false}}
    calibrations:
      stat: {values: [today, 3d, 5d, 10d], default: today}
    providers: [{endpoint: flow.board_stock, field: "", args: {board_code: board_code, stat: stat, page_size: page_size}, row: all, priority: 1}]

  - id: lhb
    name: 龙虎榜
    aliases: [龙虎榜, 龙虎]
    group: capital
    kind: table
    args: {trade_date: {required: false}, page_size: {required: false}}
    providers: [{endpoint: dc.get, field: "", args: {report: RPT_DAILYBILLBOARD_DETAILSNEW, sort_columns: TRADE_DATE, page_size: page_size}, row: all, priority: 1}]

  # 龙虎榜 · 明细/营业部维度（datacenter RPT_*；口径取自 data.eastmoney.com/newstatic/js/lhb/*.js）
  - id: lhb_trade_detail
    name: 龙虎榜交易明细
    aliases: [龙虎榜交易明细, 龙虎榜明细, lhb_trade_detail]
    group: capital
    kind: table
    args: {trade_date: {required: true}, page_size: {required: false}, page: {required: false}}
    calibrations:
      market: {values: [all, sha, kcb, sza, cyb, bja, kzz], default: all, maps: {all: '', sha: '(TRADE_MARKET_CODE in ("069001001001","069001001006","069001001003"))', kcb: '(TRADE_MARKET_CODE="069001001006")', sza: '(TRADE_MARKET_CODE in ("069001002001","069001002002","069001002005"))', cyb: '(TRADE_MARKET_CODE="069001002002")', bja: '(TRADE_MARKET_CODE="069001017")', kzz: '(SECURITY_TYPE_CODE="060")'}}
    providers:
      - {endpoint: dc.get, field: "", args: {report: RPT_DAILYBILLBOARD_DETAILSNEW, filter: "(TRADE_DATE<='{trade_date}')(TRADE_DATE>='{trade_date}'){market_field}", sort_columns: TRADE_DATE, sort_types: -1, page_size: page_size, page: page}, row: all, priority: 1}

  - id: lhb_stock_day
    name: 个股单日龙虎榜明细
    aliases: [个股单日龙虎榜, 单日龙虎榜明细, lhb_stock_day]
    group: capital
    kind: table
    args: {code: {required: true}, trade_date: {required: true}, page_size: {required: false}}
    providers:
      - {endpoint: dc.get, field: "", args: {report: RPT_DAILYBILLBOARD_DETAILSNEW, filter: "(SECURITY_CODE=\"{code}\")(TRADE_DATE<='{trade_date}')(TRADE_DATE>='{trade_date}')", sort_columns: TRADE_DATE, sort_types: -1, page_size: page_size}, row: all, priority: 1}

  - id: lhb_stock_history
    name: 个股龙虎榜历史
    aliases: [个股龙虎榜历史, 龙虎榜历史, lhb_stock_history]
    group: capital
    kind: table
    args: {code: {required: true}, page_size: {required: false}}
    providers:
      - {endpoint: dc.get, field: "", args: {report: RPT_BILLBOARD_DAILYDETAILS, filter: '(SECURITY_CODE="{code}")', sort_columns: TRADE_DATE, sort_types: -1, page_size: page_size}, row: all, priority: 1}

  - id: lhb_stock_stat
    name: 个股龙虎榜统计
    aliases: [个股上榜统计, 龙虎榜统计, lhb_stock_stat]
    group: capital
    kind: table
    args: {page_size: {required: false}, page: {required: false}}
    calibrations:
      cycle: {values: ['1m', '3m', '6m', '1y'], default: 3m, maps: {'1m': '01', '3m': '02', '6m': '03', '1y': '04'}}
    providers:
      - {endpoint: dc.get, field: "", args: {report: RPT_BILLBOARD_TRADEALLNEW, filter: '(STATISTICS_CYCLE="{cycle_field}")', sort_columns: BILLBOARD_TIMES, sort_types: -1, page_size: page_size, page: page}, row: all, priority: 1}

  - id: lhb_org_daily
    name: 机构买卖每日统计
    aliases: [机构买卖每日统计, 机构买卖情况, lhb_org_daily]
    group: capital
    kind: table
    args: {date_from: {required: true}, page_size: {required: false}, page: {required: false}}
    calibrations:
      market: {values: [all, sha, kcb, sza, cyb, bja, kzz], default: all, maps: {all: '', sha: '(TRADE_MARKET_CODE in ("069001001001","069001001006","069001001003"))', kcb: '(TRADE_MARKET_CODE="069001001006")', sza: '(TRADE_MARKET_CODE in ("069001002001","069001002002","069001002005"))', cyb: '(TRADE_MARKET_CODE="069001002002")', bja: '(TRADE_MARKET_CODE="069001017")', kzz: '(SECURITY_TYPE_CODE="060")'}}
